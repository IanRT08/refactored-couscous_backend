<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de descarga aprobada — AW-SHEF</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:30px 0;">
    <tr><td align="center">
        <table width="580" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

            <!-- Encabezado CENIDET -->
            <tr>
                <td style="background-color:#1B8E3B;padding:24px 32px;">
                    <p style="margin:0;color:#ffffff;font-size:18px;font-weight:bold;letter-spacing:0.5px;">
                        AW-SHEF · CENIDET
                    </p>
                    <p style="margin:4px 0 0;color:#bfe8cc;font-size:12px;">
                        Solicitud de permiso de descarga
                    </p>
                </td>
            </tr>

            <!-- Cuerpo -->
            <tr>
                <td style="padding:32px 32px 24px;">
                    <p style="margin:0 0 8px;color:#333333;font-size:16px;">Hola, <strong>{{nombre}}</strong></p>
                    <p style="margin:0 0 20px;color:#555555;font-size:14px;line-height:1.6;">
                        ¡Buenas noticias! Tu solicitud de permiso de descarga fue
                        <strong style="color:#1B8E3B;">aprobada</strong>. Ya puedes descargar gráficas
                        y tablas desde la plataforma.
                    </p>

                    <table width="100%" cellpadding="0" cellspacing="0">
                        <tr><td style="padding:12px 16px;background-color:#f3fbf5;border-left:4px solid #1B8E3B;border-radius:4px;">
                            <p style="margin:0;color:#2c4a36;font-size:13px;line-height:1.6;">
                                {{comentario}}
                            </p>
                        </td></tr>
                    </table>
                </td>
            </tr>

            <!-- Pie -->
            <tr>
                <td style="background-color:#f4f6f8;padding:16px 32px;border-top:1px solid #e0e4ea;">
                    <p style="margin:0;color:#999999;font-size:11px;text-align:center;">
                        AW-SHEF · CENIDET — Correo automático, no responder.
                    </p>
                </td>
            </tr>

        </table>
    </td></tr>
</table>
</body>
</html>
